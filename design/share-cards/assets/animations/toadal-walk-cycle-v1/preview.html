  img { display: block; width: 100%; height: 100%; object-fit: contain; }

  p { color: #c9bfdc; }
</style>
</head>
<body>
<main>
  <h1>Frog Prince · Walk Cycle</h1>
  <div class="stage"><img src="toadal-walk-cycle.webp" alt="Golden frog prince walking in place, with a crown, red scarf, star medallion, and backpack."></div>

</main>
