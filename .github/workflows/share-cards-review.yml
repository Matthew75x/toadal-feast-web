name: Share cards review

on:
  pull_request:
    paths:
      - 'services/share-cards/**'
      - 'docs/implementation/SHARE_CARDS_AND_INVITES.md'
      - '.github/workflows/share-cards-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: services/share-cards
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run verify:assets
      - run: npm run build:worker
