name: Verify staging pull request

on:
  pull_request:
    branches:
      - staging/live-visual

permissions:
  contents: read

concurrency:
  group: staging-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify guest progression and exact runtime resource pins
        run: node --test scripts/guest-progression.test.mjs scripts/guest-reset-recovery.test.mjs scripts/guest-progress-refresh.test.mjs scripts/feast-pass-game-records.test.mjs scripts/game-progress-contract.test.mjs scripts/quest-journey.test.mjs scripts/guest-showcase.test.mjs scripts/play-catalogue.test.mjs scripts/protected-game-artifacts.test.mjs scripts/staging-artifact.test.mjs scripts/mobile-interaction-closure.test.mjs scripts/companion-visibility.test.mjs scripts/advanced-runtime-externalization.test.mjs scripts/intrinsic-image-dimensions.test.mjs scripts/owner-preview-browser-matrix-readiness.test.mjs
      - name: Verify staging-only Pages policy
        run: |
          node scripts/verify-pages-basepath.mjs dist /toadal-feast-web/
          node scripts/verify-static-links.mjs dist /toadal-feast-web/
          node scripts/verify-staging-robots.mjs dist staging
      - name: Verify exact staging payload without publishing
        run: >-
          node scripts/staging-artifact.mjs prepare
          --source "$GITHUB_SHA" --input dist
          --output "$RUNNER_TEMP/toadal-staging-pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
