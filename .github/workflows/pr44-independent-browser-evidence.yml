# Existing evidence-only branch. Product source and release gates stay unchanged.
name: Final staging browser evidence (no release)

on:
  push:
    branches:
      - qa/pr44-browser-evidence-20261011

permissions:
  contents: read

concurrency:
  group: independent-pr44-browser-evidence
  cancel-in-progress: true

jobs:
  verify-genuine-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Bind unchanged product source to frozen PR44
        shell: bash
        run: |
          set -euo pipefail
          FROZEN=96b237447e64499957d511df1ec4ab46dace1eca
          test "$(git rev-parse HEAD:dist)" = "$(git rev-parse "$FROZEN:dist")"
          git diff --exit-code "$FROZEN" HEAD -- dist studio-project scripts manifests
          test ! -e dist/public/games/claw-feed-gulper/index.html
          test -e dist/public/games/wicked-bites/index.html
          mkdir -p "$RUNNER_TEMP/pr44-gameplay-evidence"
          git log -1 --format='%H %T' > "$RUNNER_TEMP/pr44-gameplay-evidence/qa-head.txt"
      - name: Install pinned test-only browser driver outside product checkout
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pr44-playwright" --no-audit --no-fund --ignore-scripts playwright-core@1.55.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pr44-playwright/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Verify deployed staging navigation, genuine gameplay and held admission
        shell: bash
        env:
          TOADAL_QA_REPO: ${{ github.workspace }}
          TOADAL_QA_OUTPUT: ${{ runner.temp }}/pr44-gameplay-evidence
          TOADAL_QA_BASE: https://matthew75x.github.io/toadal-feast-web/
          TOADAL_QA_EXPECTED_STAGING_SHA: c6faed79506253deb638df053c28e838af5ba173
          TOADAL_QA_STAGING_REF: staging/live-visual
          TOADAL_QA_PAGES_RUN_ID: '38109996961'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/pr44-gameplay-closeout.mjs 2>&1 | tee "$TOADAL_QA_OUTPUT/journey-console.log"
      - name: Confirm tests did not change product bytes
        if: always()
        shell: bash
        run: git diff --exit-code 96b237447e64499957d511df1ec4ab46dace1eca HEAD -- dist studio-project scripts manifests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-staging-browser-evidence
          path: ${{ runner.temp }}/pr44-gameplay-evidence
          if-no-files-found: error
          retention-days: 14
