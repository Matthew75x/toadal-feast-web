name: Deploy GitHub Pages

on:
  push:
    branches:
      - staging/live-visual
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging/live-visual'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify guest progression and exact runtime resource pins
        run: node --test scripts/guest-progression.test.mjs scripts/guest-reset-recovery.test.mjs scripts/guest-progress-refresh.test.mjs scripts/feast-pass-game-records.test.mjs scripts/quest-journey.test.mjs scripts/guest-showcase.test.mjs scripts/play-catalogue.test.mjs
      - name: Apply and verify staging-only Pages policy
        run: |
          node scripts/wo001-pages-basepath.mjs dist /toadal-feast-web/ --staging-robots
          node scripts/verify-pages-basepath.mjs dist /toadal-feast-web/
          node scripts/verify-static-links.mjs dist /toadal-feast-web/
          node scripts/verify-staging-robots.mjs dist staging
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
