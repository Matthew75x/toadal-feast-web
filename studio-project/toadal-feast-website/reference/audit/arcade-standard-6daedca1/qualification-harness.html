<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f3c52b'/%3E%3C/svg%3E">
  <title>WO-003 isolated Arcade qualification harness</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #21151a; color: #fff7e8; font: 16px system-ui, sans-serif; }
    header { min-height: 48px; box-sizing: border-box; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header button { border: 1px solid #806b2b; border-radius: 7px; padding: 6px 10px; color: #fff7e8; background: #302719; cursor: pointer; }
    iframe { display: block; width: 100vw; height: calc(100vh - 48px); border: 0; background: #16110e; }
  </style>
</head>
<body>
  <header><span>WO-003 qualification harness · opaque-origin Arcade frame</span><button id="host-fullscreen" type="button">Host fullscreen</button></header>
  <iframe
    id="arcade-cartridge"
    title="TOADAL FEAST Arcade isolated qualification"
    src="arcade-standalone.html"
    sandbox="allow-scripts allow-pointer-lock"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    (() => {
      const frame = document.getElementById('arcade-cartridge');
      document.getElementById('host-fullscreen').addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await frame.requestFullscreen();
        } catch (error) {
          window.__wo003FullscreenError = String(error && error.name || error);
        }
      });
      const protocol = 'toadal.game.v1';
      const gameId = 'toadal-feast-arcade-preview';
      window.__wo003Messages = [];
      window.__wo003Send = (type, payload = {}) => {
        // An opaque origin has no serializable targetOrigin. The host sends
        // only to this exact iframe WindowProxy; inbound traffic is source- and
        // origin-checked below.
        frame.contentWindow.postMessage({ protocol, gameId, type, payload }, '*');
      };
      window.__wo003FocusReturn = () => window.__wo003Send('host:resume', { reason: 'host-focus-returned' });
      // Model the existing website host's page-level focus ownership: only
      // Window-targeted focus/blur is forwarded, never descendant focus traps.
      window.addEventListener('blur', (event) => {
        if (event.target === window) window.__wo003Send('host:pause', { reason: 'host-focus-lost' });
      }, true);
      window.addEventListener('focus', (event) => {
        if (event.target === window) window.__wo003Send('host:resume', { reason: 'host-focus-returned' });
      }, true);
      window.__wo003SpoofPause = async () => {
        const sibling = document.createElement('iframe');
        sibling.hidden = true;
        await new Promise((resolve) => {
          sibling.addEventListener('load', resolve, { once: true });
          document.body.appendChild(sibling);
          if (sibling.contentDocument && sibling.contentDocument.readyState === 'complete') resolve();
        });
        const message = JSON.stringify({ protocol, gameId, type: 'host:pause', payload: { reason: 'spoof-source-test' } });
        sibling.contentWindow.eval(`parent.document.getElementById('arcade-cartridge').contentWindow.postMessage(${message}, '*')`);
        window.setTimeout(() => sibling.remove(), 100);
      };
      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow || event.origin !== 'null') return;
        const message = event.data;
        if (!message || message.protocol !== protocol || message.gameId !== gameId) return;
        window.__wo003Messages.push({ type: message.type, payload: message.payload || {}, at: Date.now() });
      });
      const initialize = () => window.__wo003Send('host:init');
      frame.addEventListener('load', initialize);
      initialize();
      document.addEventListener('visibilitychange', () => {
        window.__wo003Send('host:visibility', { visibility: document.hidden ? 'hidden' : 'visible' });
      });
      let retries = 0;
      const timer = window.setInterval(() => {
        if (window.__wo003Messages.some((message) => message.type === 'game:ready') || retries++ > 20) {
          window.clearInterval(timer);
        } else initialize();
      }, 250);
    })();
  </script>
</body>
</html>
